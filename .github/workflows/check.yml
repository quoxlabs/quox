name: check

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:
    types: [checks_requested]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/quox

      - run: cargo fmt --check
        working-directory: packages/quox
      - run: deno fmt --check

      - run: cargo clippy --locked --target wasm32-unknown-unknown --all-targets -- -D warnings
        working-directory: packages/quox
      - run: deno lint

      - run: deno task build
      - run: deno check

      - run: cargo test --locked
        working-directory: packages/quox
      - run: deno test

      - run: deno publish --dry-run
