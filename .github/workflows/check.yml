name: check

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:
    types: [checks_requested]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/quox
      - run: deno ci

      - run: cargo fmt --check
        working-directory: packages/quox
      - run: deno fmt --check

      - run: cargo clippy --locked --target wasm32-unknown-unknown --all-targets -- -D warnings
        working-directory: packages/quox
      - run: deno lint

      - run: deno task build
      - run: deno check

      - run: cargo test --locked
        working-directory: packages/quox
      - run: deno test

      - run: deno publish --dry-run

  winding-darwin:
    name: Winding Darwin (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner:
          - macos-15
          - macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
          cache: true
      - run: deno ci
      - run: deno check darwin/mod.ts darwin/*_test.ts
        working-directory: packages/winding
      - run: deno test --allow-ffi darwin
        working-directory: packages/winding

  winding-windows:
    name: Winding Windows (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
          cache: true
      - run: deno ci
      - run: deno check win32/mod.ts win32/input_test.ts win32/native_smoke.ts
        working-directory: packages/winding
      - run: deno test win32/input_test.ts
        working-directory: packages/winding
      - name: Test live Win32 input and lifecycle
        run: deno test --allow-ffi win32/native_smoke.ts
        timeout-minutes: 2
        working-directory: packages/winding

  winding-wayland:
    name: Winding Wayland (ubuntu-24.04)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
          cache: true
      - run: deno ci
      - run: sudo apt-get update
      - run: sudo apt-get install -y --no-install-recommends weston xwayland-run
      - run: deno check wayland/mod.ts wayland/input_test.ts wayland/headless_smoke.ts
        working-directory: packages/winding
      - run: deno test wayland/input_test.ts
        working-directory: packages/winding
      - name: Test live Wayland lifecycle
        run: >
          wlheadless-run -c weston --renderer=pixman --
          timeout --kill-after=5s 30s
          env LANG=C.UTF-8 LC_ALL=C.UTF-8
          deno test --allow-ffi --allow-env=LC_ALL,LC_CTYPE,LANG
          wayland/headless_smoke.ts
        working-directory: packages/winding
