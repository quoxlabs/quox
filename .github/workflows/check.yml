name: check

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:
    types: [checks_requested]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
          cache: true
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/quox
      - run: deno fmt --check
      - run: deno lint
      - run: deno task build
      - run: deno check
      - run: deno publish --dry-run
