[package]
name = "quox"
version = "0.0.1"
edition = "2024"

[lints.clippy]
missing_errors_doc = "allow"
pedantic = { level = "warn", priority = -1 }

[lib]
crate-type = ["cdylib"]
name = "quox"

[dependencies]
anyrender_vello = "0.12"
linebender_resource_handle = "0.1.1"
blitz-dom = "=0.3.0-alpha.6"
blitz-html = "=0.3.0-alpha.6"
blitz-paint = "=0.3.0-alpha.6"
blitz-traits = "=0.3.0-alpha.6"
console_error_panic_hook = "0.1"
futures-intrusive = "0.5"
keyboard-types = "0.7"
smol_str = "0.3.6"
vello = "0.9"
wasm-bindgen = "=0.2.108"
wasm-bindgen-futures = "=0.4.58"
wgpu_context = "0.7"
